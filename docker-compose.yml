services:
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 */2 * * *
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  nemea-agent:
    container_name: nemea-agent
    build: .
    image: tyreez/nemea-agent:latest
    environment:
      - API_KEY=${API_KEY}
      - CONFIG_URL=${CONFIG_URL}
      - GEO_API_KEY=${GEO_API_KEY}
      # Optional: what this probe is called in the console. Without it the server
      # names it after wherever it says it is.
      - AGENT_NAME=${AGENT_NAME:-}
    restart: always
    volumes:
      - ./logs:/app/logs
      # The agent's own token lives here. Watchtower replaces this container on
      # every release, and without a volume each new image would enrol as a brand
      # new agent while the old one sat in the console going stale.
      - ./state:/app/state
